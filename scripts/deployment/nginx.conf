# Install as /etc/nginx/sites-available/detective after obtaining certificates.
# Keep the existing site backup before replacing its active configuration.
server {
    listen 80 default_server;
    server_name linyouwei.top www.linyouwei.top;
    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://linyouwei.top$request_uri; }
}

server {
    listen 80;
    server_name detective.linyouwei.top;
    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://detective.linyouwei.top$request_uri; }
}

server {
    listen 443 ssl;
    server_name linyouwei.top www.linyouwei.top;
    ssl_certificate /etc/letsencrypt/live/linyouwei.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/linyouwei.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /var/www/personal-page/current;
    index index.html;
    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
    add_header X-Content-Type-Options nosniff always;

    # Revalidate public HTML; versioned illustrations keep their existing cache policy.
    location ~ ^/(?:[^/]+\.html|posts/[^/]+\.html)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Web-sized scenes use versioned URLs; do not cache HTML with these rules.
    location ^~ /assets/illustrations/web/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options nosniff always;
    }

    location = /waline { return 301 /waline/; }
    # Registration stays local: provision the first administrator over SSH.
    location ~* ^/waline/(?:api/)?user(?:/|$) {
        limit_except GET PUT DELETE OPTIONS { allow 127.0.0.1; deny all; }
        rewrite ^/waline/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8360;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /waline/ {
        proxy_pass http://127.0.0.1:8360/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
    location / { try_files $uri $uri/ =404; }
}

server {
    listen 443 ssl;
    server_name detective.linyouwei.top;
    ssl_certificate /etc/letsencrypt/live/linyouwei.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/linyouwei.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /opt/detective-assistant/frontend/dist;
    index index.html;
    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }

    location /api/ {
        proxy_pass http://127.0.0.1:8001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
    location = /login { return 302 /; }
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }
    location / { try_files $uri $uri/ /index.html; }
}
