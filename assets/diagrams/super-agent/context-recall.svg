<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 1135" role="img" aria-labelledby="title desc">
  <title id="title">Inline、Spill 与链式召回</title>
  <desc id="desc">从一条 Trigger 出发，沿群聊 Thread、Worker 和 PR Thread 的有向路径逐步召回。当前上下文内联各对象的 ID 与摘要，完整消息、讨论和执行记录留在窗口外，需要时通过读取工具取回。引用图可以有环，但这次检索只沿所需路径展开。</desc>
  <defs>
    <marker id="arrow-main" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#c0814f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-tool" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#76919a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <pattern id="hatch-card" width="11" height="11" patternTransform="rotate(42)" patternUnits="userSpaceOnUse"><path d="M0 0v11" stroke="#93a5a4" stroke-opacity=".26" stroke-width="1.4"/></pattern>
    <pattern id="hatch-store" width="10" height="10" patternTransform="rotate(-42)" patternUnits="userSpaceOnUse"><path d="M0 0v10" stroke="#c39d70" stroke-opacity=".28" stroke-width="1.2"/></pattern>
    <style>
      text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#344651}
      .title{font-size:29px;font-weight:700}
      .sub{font-size:18px;fill:#62747b}
      .node{font-size:20px;font-weight:700}
      .body{font-size:18px}
      .small{font-size:16px;fill:#637277}
      .chip{font-size:15px;font-weight:600}
    </style>
  </defs>
  <rect width="680" height="1135" rx="26" fill="#fbf8f0"/>
  <path d="M24 28q311-15 631 1m-630 1078q309 15 628-1" fill="none" stroke="#c6b99f" stroke-opacity=".45" stroke-width="1.5" stroke-linecap="round"/>
  <path d="m37 100 10-4m-8 11 8-4m584-1 11-4m-8 10 8-4m-585 996 10-4" stroke="#ac9a7e" stroke-opacity=".4" stroke-width="1.1" stroke-linecap="round"/>

  <text x="40" y="62" class="title">从一条消息，逐步找回相关上下文</text>
  <text x="40" y="96" class="sub">链式召回沿引用读取；ID 和摘要先进入当前上下文</text>
  <rect x="77" y="121" width="526" height="46" rx="22" fill="#f5eee1" stroke="#b6a27f" stroke-width="1.4"/>
  <text x="340" y="151" text-anchor="middle" class="body">示意检索路径 · 不代表原型的固定数据结构</text>

  <text x="93" y="204" class="node" style="font-size:19px;fill:#657b84">内联到当前上下文 · Inline</text>
  <text x="570" y="204" text-anchor="end" class="small">ID + 摘要</text>

  <path d="M77 291v66" stroke="#c08050" stroke-width="2.8" stroke-linecap="round" stroke-dasharray="1 8" marker-end="url(#arrow-main)"/>
  <path d="M77 446v66" stroke="#c08050" stroke-width="2.8" stroke-linecap="round" stroke-dasharray="1 8" marker-end="url(#arrow-main)"/>
  <path d="M77 601v66" stroke="#c08050" stroke-width="2.8" stroke-linecap="round" stroke-dasharray="1 8" marker-end="url(#arrow-main)"/>

  <circle cx="77" cy="267" r="22" fill="#e8d3b6" stroke="#ad8c67" stroke-width="1.5"/>
  <text x="77" y="274" text-anchor="middle" class="chip">1</text>
  <path d="M112 224q0-4 5-4 208-3 442 0 5 1 5 5v94q0 5-5 5-215 3-442 0-5 0-5-5z" fill="#f1f4f2" stroke="#849a9a" stroke-width="1.7"/>
  <path d="M120 231q202-4 432 0v16q-230 3-432-1z" fill="url(#hatch-card)"/>
  <rect x="132" y="258" width="148" height="27" rx="13" fill="#e8d3b6" stroke="#b49a78" stroke-width="1"/>
  <text x="206" y="277" text-anchor="middle" class="chip">Trigger · msg-98</text>
  <text x="132" y="307" class="body">消息摘要：登录接口报错 500</text>

  <circle cx="77" cy="422" r="22" fill="#e4ecee" stroke="#7e9aaa" stroke-width="1.5"/>
  <text x="77" y="429" text-anchor="middle" class="chip">2</text>
  <path d="M112 377q0-4 5-4 208-3 442 0 5 1 5 5v94q0 5-5 5-215 3-442 0-5 0-5-5z" fill="#edf3f4" stroke="#839ba4" stroke-width="1.7"/>
  <path d="M120 384q202-4 432 0v16q-230 3-432-1z" fill="url(#hatch-card)"/>
  <rect x="132" y="411" width="166" height="27" rx="13" fill="#e0eaec" stroke="#91a6a9" stroke-width="1"/>
  <text x="215" y="430" text-anchor="middle" class="chip">群聊 Thread · t-15</text>
  <text x="132" y="460" class="body">摘要：上线后出现的登录故障讨论</text>

  <circle cx="77" cy="577" r="22" fill="#e2eadc" stroke="#829376" stroke-width="1.5"/>
  <text x="77" y="584" text-anchor="middle" class="chip">3</text>
  <path d="M112 532q0-4 5-4 208-3 442 0 5 1 5 5v94q0 5-5 5-215 3-442 0-5 0-5-5z" fill="#eef1e8" stroke="#89977e" stroke-width="1.7"/>
  <path d="M120 539q202-4 432 0v16q-230 3-432-1z" fill="url(#hatch-card)"/>
  <rect x="132" y="566" width="129" height="27" rx="13" fill="#e3eadb" stroke="#9aa58f" stroke-width="1"/>
  <text x="196" y="585" text-anchor="middle" class="chip">Worker · w-04</text>
  <text x="132" y="615" class="body">摘要：排查数据库连接超时</text>

  <circle cx="77" cy="732" r="22" fill="#f0dfcb" stroke="#bc926c" stroke-width="1.5"/>
  <text x="77" y="739" text-anchor="middle" class="chip">4</text>
  <path d="M112 687q0-4 5-4 208-3 442 0 5 1 5 5v94q0 5-5 5-215 3-442 0-5 0-5-5z" fill="#f5eee4" stroke="#ba9c78" stroke-width="1.7"/>
  <path d="M120 694q202-4 432 0v16q-230 3-432-1z" fill="url(#hatch-store)"/>
  <rect x="132" y="721" width="157" height="27" rx="13" fill="#f0dfcb" stroke="#c3a17f" stroke-width="1"/>
  <text x="210" y="740" text-anchor="middle" class="chip">PR Thread · pr-27</text>
  <text x="132" y="770" class="body">摘要：登录修复 PR 的评审讨论</text>

  <path d="M88 831q0-5 6-5h578q5 0 5 5v150q0 5-5 5H94q-6 0-6-5z" fill="#f6f0e3" stroke="#b59f7b" stroke-width="1.6"/>
  <path d="M97 838q225-5 566 0v17q-274 4-566 0z" fill="url(#hatch-store)"/>
  <text x="113" y="878" class="node" style="font-size:21px">窗口外 · Spill</text>
  <text x="113" y="907" class="body">完整日志、聊天历史、Worker 执行记录、PR 评论</text>
  <rect x="113" y="925" width="260" height="38" rx="17" fill="#e8edef" stroke="#8298a0" stroke-width="1.2"/>
  <text x="243" y="950" text-anchor="middle" class="small">需要时调用工具按 ID 读取</text>
  <path d="M502 923c46-33 45-74 8-106" fill="none" stroke="#76919a" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrow-tool)"/>

  <text x="52" y="1034" class="small">引用可以形成有环的图；本次只沿所需路径检索，不会自动展开全部关联。</text>
  <text x="642" y="1103" text-anchor="end" class="small" style="font-size:13px">路径与内容为解释性示意</text>
</svg>
