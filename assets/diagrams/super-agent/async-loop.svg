<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 1300" role="img" aria-labelledby="title desc">
  <title id="title">同步工具等待与异步 ReAct Loop</title>
  <desc id="desc">上半部分显示同步运行测试时前台等待，期间的新消息排队。下半部分显示异步 start 立即返回任务 ID，测试在后台持续，前台在推理步骤之间处理新消息并启动第二个任务，任务完成后作为事件返回。单个会话仍在推理步骤边界按顺序处理消息。</desc>
  <defs>
    <marker id="arrow-sync" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#bb8660" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-async" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#708e83" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <pattern id="hatch-wait" width="10" height="10" patternTransform="rotate(42)" patternUnits="userSpaceOnUse"><path d="M0 0v10" stroke="#c58f67" stroke-opacity=".3" stroke-width="1.2"/></pattern>
    <pattern id="hatch-go" width="10" height="10" patternTransform="rotate(-42)" patternUnits="userSpaceOnUse"><path d="M0 0v10" stroke="#829781" stroke-opacity=".28" stroke-width="1.2"/></pattern>
    <style>
      text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#344651}
      .title{font-size:29px;font-weight:700}
      .sub{font-size:18px;fill:#64767b}
      .panel{font-size:22px;font-weight:700}
      .label{font-size:18px;font-weight:700}
      .body{font-size:17px}
      .small{font-size:15px;fill:#64747a}
      .tiny{font-size:14px;fill:#68777a}
    </style>
  </defs>
  <rect width="680" height="1300" rx="26" fill="#fbf8f0"/>
  <path d="M23 30q304-15 633 1m-630 1234q306 14 629-2" fill="none" stroke="#c6b99f" stroke-opacity=".45" stroke-width="1.5" stroke-linecap="round"/>
  <path d="m36 99 10-4m-8 10 9-4m580 0 10-4m-8 10 8-4" stroke="#ad9b7f" stroke-opacity=".42" stroke-width="1.1" stroke-linecap="round"/>

  <text x="40" y="62" class="title">耗时工具，怎样不再卡住对话？</text>
  <text x="40" y="96" class="sub">同步调用等待最终结果；异步 start 先返回，任务后台继续</text>

  <path d="M34 131q0-6 6-6h600q6 0 6 6v321q0 6-6 6H40q-6 0-6-6z" fill="#f7efe3" stroke="#b99d7c" stroke-width="1.7"/>
  <path d="M43 139q255-5 581 0v18q-285 4-581 0z" fill="url(#hatch-wait)"/>
  <text x="57" y="182" class="panel">同步工具调用</text>
  <rect x="473" y="158" width="167" height="31" rx="15" fill="#f0dfcb" stroke="#c29b75" stroke-width="1"/>
  <text x="556" y="179" class="tiny" text-anchor="middle">当前推理步持续等待</text>

  <circle cx="75" cy="236" r="20" fill="#ecd7be" stroke="#b28b69" stroke-width="1.3"/>
  <text x="75" y="241" class="tiny" text-anchor="middle" style="font-weight:700">1</text>
  <rect x="109" y="208" width="208" height="58" rx="15" fill="#fbf8ef" stroke="#b6a78f" stroke-width="1.3"/>
  <text x="213" y="233" class="label" text-anchor="middle">模型调用 run(测试)</text>
  <text x="213" y="253" class="tiny" text-anchor="middle">工具要等最终结果才返回</text>
  <path d="M321 236h37" stroke="#bc8861" stroke-width="2" marker-end="url(#arrow-sync)"/>
  <rect x="370" y="208" width="254" height="58" rx="15" fill="#f5eadb" stroke="#bf9b7b" stroke-width="1.3"/>
  <text x="497" y="233" class="label" text-anchor="middle">后台测试正在运行</text>
  <text x="497" y="253" class="tiny" text-anchor="middle">尚未返回 · 前台不能继续这一轮</text>

  <circle cx="75" cy="320" r="20" fill="#ecd7be" stroke="#b28b69" stroke-width="1.3"/>
  <text x="75" y="325" class="tiny" text-anchor="middle" style="font-weight:700">2</text>
  <rect x="109" y="292" width="208" height="58" rx="15" fill="#f3e7d7" stroke="#c29b75" stroke-width="1.3"/>
  <text x="213" y="317" class="label" text-anchor="middle">前台等待</text>
  <text x="213" y="337" class="tiny" text-anchor="middle">当前模型循环被工具结果挂住</text>
  <path d="M321 320h37" stroke="#bc8861" stroke-width="2" marker-end="url(#arrow-sync)"/>
  <rect x="370" y="292" width="254" height="58" rx="15" fill="#fbf7ee" stroke="#c8a98b" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="497" y="317" class="label" text-anchor="middle">新消息到达</text>
  <text x="497" y="337" class="tiny" text-anchor="middle">暂存在队列，等测试结束后处理</text>

  <circle cx="75" cy="404" r="20" fill="#ecd7be" stroke="#b28b69" stroke-width="1.3"/>
  <text x="75" y="409" class="tiny" text-anchor="middle" style="font-weight:700">3</text>
  <rect x="109" y="376" width="515" height="53" rx="15" fill="#f0e4d4" stroke="#c09b78" stroke-width="1.3"/>
  <text x="367" y="400" class="label" text-anchor="middle">测试返回 → 模型继续 → 才能处理排队消息</text>
  <text x="367" y="419" class="tiny" text-anchor="middle">等待期间，用户体验像对话停住了</text>

  <path d="M34 486q0-6 6-6h600q6 0 6 6v564q0 6-6 6H40q-6 0-6-6z" fill="#eef2e9" stroke="#8a9a84" stroke-width="1.7"/>
  <path d="M43 494q255-5 581 0v18q-285 4-581 0z" fill="url(#hatch-go)"/>
  <text x="57" y="537" class="panel">异步 start / stop</text>
  <rect x="447" y="514" width="193" height="31" rx="15" fill="#e2eade" stroke="#92a08c" stroke-width="1"/>
  <text x="543" y="535" class="tiny" text-anchor="middle">工具先返回启动状态</text>

  <circle cx="75" cy="591" r="20" fill="#dce7dc" stroke="#82967e" stroke-width="1.3"/>
  <text x="75" y="596" class="tiny" text-anchor="middle" style="font-weight:700">1</text>
  <rect x="109" y="558" width="515" height="66" rx="15" fill="#f8f8ef" stroke="#91a18d" stroke-width="1.3"/>
  <text x="367" y="585" class="label" text-anchor="middle">模型调用 start(测试) → 立即收到 job-1</text>
  <text x="367" y="608" class="small" text-anchor="middle">本轮推理结束；耗时任务转入后台</text>

  <rect x="56" y="647" width="89" height="37" rx="18" fill="#e6d7bd" stroke="#b49a75" stroke-width="1.2"/>
  <text x="100" y="672" class="tiny" text-anchor="middle" style="font-weight:700">后台任务</text>
  <path d="M157 665h447" stroke="#7c9279" stroke-width="3" stroke-linecap="round"/>
  <path d="M157 665h315" stroke="#77937c" stroke-width="3" stroke-linecap="round" stroke-dasharray="5 7"/>
  <circle cx="182" cy="665" r="7" fill="#fbf8ef" stroke="#78917c" stroke-width="2"/>
  <circle cx="383" cy="665" r="7" fill="#fbf8ef" stroke="#78917c" stroke-width="2"/>
  <circle cx="589" cy="665" r="9" fill="#e7eee3" stroke="#6f8b75" stroke-width="2"/>
  <text x="157" y="697" class="small">测试持续运行</text>
  <text x="588" y="697" class="small" text-anchor="end">完成后发事件</text>

  <rect x="56" y="722" width="89" height="37" rx="18" fill="#dce8ed" stroke="#829ca5" stroke-width="1.2"/>
  <text x="100" y="747" class="tiny" text-anchor="middle" style="font-weight:700">前台对话</text>
  <path d="M157 740h26m104 0h23m174 0h23" stroke="#728d9a" stroke-width="2" marker-end="url(#arrow-async)"/>
  <rect x="192" y="710" width="91" height="58" rx="13" fill="#f5f7f3" stroke="#8da1a4" stroke-width="1.2"/>
  <text x="237" y="734" class="tiny" text-anchor="middle">收到新消息</text>
  <text x="237" y="753" class="tiny" text-anchor="middle">当前步结束后</text>
  <rect x="318" y="710" width="168" height="58" rx="13" fill="#f4f6ed" stroke="#93a18b" stroke-width="1.2"/>
  <text x="402" y="734" class="tiny" text-anchor="middle">模型处理新消息</text>
  <text x="402" y="753" class="tiny" text-anchor="middle">再 start(构建) → job-2</text>
  <rect x="521" y="710" width="103" height="58" rx="13" fill="#e8efdf" stroke="#90a183" stroke-width="1.2"/>
  <text x="572" y="734" class="tiny" text-anchor="middle">收到 job-2</text>
  <text x="572" y="753" class="tiny" text-anchor="middle">后台继续</text>

  <path d="M589 665c21 1 42 12 45 28v163h-54" fill="none" stroke="#78937e" stroke-width="1.8" stroke-dasharray="4 4" marker-end="url(#arrow-async)"/>
  <rect x="93" y="823" width="494" height="70" rx="17" fill="#e2eadf" stroke="#83977f" stroke-width="1.4"/>
  <circle cx="129" cy="858" r="16" fill="#f8f7ed" stroke="#78917c" stroke-width="1.4"/>
  <path d="m122 858 5 5 10-12" fill="none" stroke="#6f8c74" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="157" y="852" class="label">job-1 完成 → 结果作为新事件送回</text>
  <text x="157" y="876" class="small">模型在后续推理步读取结果，再向用户汇报</text>

  <path d="M49 927q0-5 6-5h570q5 0 5 5v85q0 5-5 5H55q-6 0-6-5z" fill="#f4ede0" stroke="#b29f7d" stroke-width="1.4"/>
  <path d="M58 934q205-4 557 0v15q-251 3-557 0z" fill="#e8ddc6" fill-opacity=".55"/>
  <text x="76" y="971" class="label">如果 Worker 需要用户答复？</text>
  <text x="76" y="995" class="body">该任务保存进度并等待；前台仍可处理其他消息。</text>

  <path d="M58 1055h564" stroke="#a5b1aa" stroke-width="1.2" stroke-dasharray="3 5"/>
  <text x="58" y="1086" class="label">模型仍在推理步边界处理新消息。</text>
  <text x="58" y="1114" class="small">异步解除了工具等待；它不等于同一会话并行两次模型推理。</text>
  <text x="640" y="1264" text-anchor="end" class="small" style="font-size:13px">任务与时间线为机制示意</text>
</svg>
