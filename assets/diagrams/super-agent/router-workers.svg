<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 860" role="img" aria-labelledby="title desc">
  <title id="title">Router 与 Worker 如何分工</title>
  <desc id="desc">Router 接收用户任务并协调两个 Worker。Worker 分别排查登录故障和检查 CI，在隔离上下文中调查、规划、实现和验证，再把进展汇报给 Router。模型能力按实际推理负担选择。</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#66889b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#748c70" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <pattern id="hatch-blue" width="10" height="10" patternTransform="rotate(42)" patternUnits="userSpaceOnUse"><path d="M0 0v10" stroke="#87a5b4" stroke-opacity=".32" stroke-width="1.4"/></pattern>
    <pattern id="hatch-green" width="10" height="10" patternTransform="rotate(42)" patternUnits="userSpaceOnUse"><path d="M0 0v10" stroke="#82977b" stroke-opacity=".32" stroke-width="1.4"/></pattern>
    <style>
      text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#344651}
      .title{font-size:29px;font-weight:700;letter-spacing:.3px}
      .sub{font-size:20px;fill:#667680}
      .node{font-size:25px;font-weight:700}
      .body{font-size:21px}
      .small{font-size:18px;fill:#5f6f74}
      .chip{font-size:17px;font-weight:600}
    </style>
  </defs>

  <rect width="680" height="860" rx="26" fill="#fbf8f0"/>
  <path d="M23 30c150-14 470-13 632 2m-631 796c177 14 448 13 631-3" fill="none" stroke="#c6b99f" stroke-opacity=".43" stroke-width="1.5" stroke-linecap="round"/>
  <path d="m34 92 12-4m-8 10 9-4M625 90l11-4m-9 10 9-4m-592 682 10-4m-6 10 10-4" stroke="#ad9c80" stroke-opacity=".42" stroke-width="1.1" stroke-linecap="round"/>

  <text x="40" y="62" class="title">任务分派：Router 与 Worker</text>
  <text x="40" y="96" class="sub">同一个入口接住请求，具体任务由隔离的执行会话推进</text>

  <rect x="169" y="122" width="342" height="49" rx="24" fill="#f2eadb" stroke="#ae9b7b" stroke-width="1.5"/>
  <path d="m187 149 12-15 12 15z" fill="#d5c3a7" stroke="#ae9b7b" stroke-width="1.2" stroke-linejoin="round"/>
  <text x="222" y="153" class="body">用户消息进入统一入口</text>
  <path d="M340 172v33" stroke="#66889b" stroke-width="2.4" fill="none" marker-end="url(#arrow-blue)"/>

  <path d="M165 217q-1-3 4-4c102-3 241-3 342 1q5 0 5 5v109q-1 5-5 5c-109 4-231 3-343 0q-5-1-4-6z" fill="#e9f0f2" stroke="#6e8995" stroke-width="2"/>
  <path d="M174 224q160-5 327 0v16q-157 3-327-1z" fill="url(#hatch-blue)"/>
  <path d="M170 222q178-5 343 1m-342 104q170 5 338 0" stroke="#91a8ad" stroke-opacity=".48" stroke-width="1" fill="none"/>
  <text x="340" y="267" class="node" text-anchor="middle">Router · 全局协调与分派</text>
  <text x="340" y="296" class="body" text-anchor="middle">识别任务、关联上下文、汇总进展</text>
  <text x="340" y="320" class="small" text-anchor="middle">轻量交互；不代替 Worker 完成具体工作</text>

  <path d="M245 336c-14 22-84 26-84 52" fill="none" stroke="#66889b" stroke-width="2.3" marker-end="url(#arrow-blue)"/>
  <path d="M435 336c14 22 84 26 84 52" fill="none" stroke="#66889b" stroke-width="2.3" marker-end="url(#arrow-blue)"/>
  <rect x="48" y="355" width="94" height="28" rx="14" fill="#f7f4ea" stroke="#b7aa90" stroke-width="1"/>
  <text x="95" y="375" text-anchor="middle" class="chip">任务 A</text>
  <rect x="539" y="355" width="94" height="28" rx="14" fill="#f7f4ea" stroke="#b7aa90" stroke-width="1"/>
  <text x="586" y="375" text-anchor="middle" class="chip">任务 B</text>

  <path d="M40 401q1-4 5-4 137-3 276 0 5 1 5 5v241q0 5-5 5-137 4-276 0-5 0-5-5z" fill="#edf2e9" stroke="#84977e" stroke-width="2"/>
  <path d="M47 408q134-5 272 0v18q-140 2-272-1z" fill="url(#hatch-green)"/>
  <text x="58" y="453" class="node">Worker A</text>
  <text x="58" y="481" class="body" style="font-size:19px">排查登录接口 500</text>
  <g fill="#f8f8ef" stroke="#9aaa90" stroke-width="1.1">
    <rect x="55" y="499" width="56" height="37" rx="10"/><rect x="117" y="499" width="56" height="37" rx="10"/><rect x="179" y="499" width="56" height="37" rx="10"/><rect x="241" y="499" width="56" height="37" rx="10"/>
  </g>
  <text x="83" y="524" class="chip" text-anchor="middle">调查</text><text x="145" y="524" class="chip" text-anchor="middle">规划</text><text x="207" y="524" class="chip" text-anchor="middle">实现</text><text x="269" y="524" class="chip" text-anchor="middle">验证</text>
  <path d="M56 548h256" stroke="#afbaa5" stroke-width="1.2" stroke-dasharray="3 5"/>
  <text x="58" y="581" class="small" style="font-size:15px">独立上下文 · 专注完成</text>
  <text x="58" y="611" class="small" style="font-size:15px">复杂时可再委派子任务</text>

  <path d="M354 401q1-4 5-4 137-3 276 0 5 1 5 5v241q0 5-5 5-137 4-276 0-5 0-5-5z" fill="#edf1f3" stroke="#7b929b" stroke-width="2"/>
  <path d="M361 408q134-5 272 0v18q-140 2-272-1z" fill="url(#hatch-blue)"/>
  <text x="372" y="453" class="node">Worker B</text>
  <text x="372" y="481" class="body" style="font-size:19px">检查 CI 失败原因</text>
  <g fill="#f6f7f3" stroke="#93a6a7" stroke-width="1.1">
    <rect x="369" y="499" width="56" height="37" rx="10"/><rect x="431" y="499" width="56" height="37" rx="10"/><rect x="493" y="499" width="56" height="37" rx="10"/><rect x="555" y="499" width="56" height="37" rx="10"/>
  </g>
  <text x="397" y="524" class="chip" text-anchor="middle">调查</text><text x="459" y="524" class="chip" text-anchor="middle">规划</text><text x="521" y="524" class="chip" text-anchor="middle">实现</text><text x="583" y="524" class="chip" text-anchor="middle">验证</text>
  <path d="M369 548h242" stroke="#afbac1" stroke-width="1.2" stroke-dasharray="3 5"/>
  <text x="372" y="581" class="small" style="font-size:15px">独立上下文 · 专注完成</text>
  <text x="372" y="611" class="small" style="font-size:15px">结果汇报给 Router</text>

  <path d="M280 401c28-24 26-45 15-61m105 61c-28-24-26-45-15-61" fill="none" stroke="#84977e" stroke-width="1.9" stroke-dasharray="4 5" marker-end="url(#arrow-green)"/>
  <text x="340" y="675" class="small" text-anchor="middle">Worker 汇报进度与结果 · Router 统一对外回复</text>

  <path d="M42 710q0-5 6-5h584q6 1 6 6v107q0 5-6 5H48q-6 0-6-5z" fill="#f5eee0" stroke="#b29c78" stroke-width="1.6"/>
  <path d="M51 718q201-4 576 0v15q-244 4-576 0z" fill="#e6d7bc" fill-opacity=".45"/>
  <text x="64" y="753" class="node" style="font-size:21px">模型按实际推理负担选</text>
  <text x="64" y="781" class="body" style="font-size:17px">轻量分派看重速度；复杂调查与代码质量更依赖强模型。</text>
  <text x="64" y="806" class="small">Worker 内部仍可拆解步骤、委派子任务。</text>

  <text x="640" y="840" text-anchor="end" class="small" style="font-size:13px">架构关系示意 · 非产品界面</text>
</svg>
